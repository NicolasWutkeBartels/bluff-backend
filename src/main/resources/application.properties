spring.application.name=bluff

# Banco. Os valores padrão apontam para o docker-compose.yml; em produção, use variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/bluff}
spring.datasource.username=${DB_USUARIO:bluff}
spring.datasource.password=${DB_SENHA:bluff}

# O Flyway é o dono do schema. O Hibernate só confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Origens do front autorizadas (CORS e WebSocket), separadas por vírgula.
bluff.cors.origens=${CORS_ORIGENS:http://localhost:3000}
